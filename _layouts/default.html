<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% if page.title %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {% else %}
  <title>{{ site.title }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>

  <nav>
    <a class="logo" href="{{ '/' | relative_url }}">ndm</a>
    <ul>
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} class="active"{% endif %}>Research</a></li>
      <li><a href="{{ '/software/' | relative_url }}"{% if page.url == '/software/' %} class="active"{% endif %}>Software</a></li>
    </ul>
  </nav>

  {{ content }}

  <footer>
    <span class="foot-name">Nuno D. Mendes · Lisbon — New York</span>
    <div class="foot-links">
      <a href="https://www.linkedin.com/in/nunodiasmendes" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/nunodelisboa" target="_blank" rel="noopener">GitHub</a>
      <a href="https://nunomendes.eu">nunomendes.eu</a>
    </div>
  </footer>

</body>
</html>
