# reconciled against redesign-concept.md (LinkedIn addendum).
# Reconciled rule: journal_papers = LinkedIn's 7 journal papers (6 from the old site
# + the Frontiers in Physiology paper). The DILS 2014 paper sits in `conference`,
# the Springer 2013 entry in `book_chapter` — neither is counted as a journal paper.
# `url` = external publisher/article link as given on the old page;
# `pdf` = repo-relative path inside nunodelisboa.github.io, only where one exists.
#
# FLAG: publications.html lists the 2014 arXiv preprint "Quantification of reachable
# attractors in asynchronous discrete dynamics" (arXiv:1411.3539) first among its
# "Journal or Conference articles". It is the preprint of the Frontiers 2018 paper
# below, so it is recorded in that entry's note rather than as a separate item,
# keeping journal_papers at exactly the reconciled 7.

