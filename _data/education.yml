    institution: "Instituto Superior Técnico"
    start: 2004
    end: 2005
    note: "Thesis: 'Inference of Complex Motifs using Biclustering Techniques'. Supervised by Ana T. Freitas and Arlindo L. Oliveira. Finished November 2005 (shortcv.html); publications.html dates the thesis 2005."

